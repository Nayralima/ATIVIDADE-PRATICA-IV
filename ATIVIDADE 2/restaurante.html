<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante Sabor & Arte</title>
    <link rel="stylesheet" href="css/estilor.css">
</head>
<body>

    <header>
        <div class="topo">
            <h1>Restaurante Sabor & Arte</h1>

            <nav>
                <ul>
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Cardápio</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="banner">
        <h2>Escolha seu prato!</h2>
    </section>


        <div class="cards">

            <div class="card">
                <div class="imagem-prato"></div>
                <div class="card-content">
                    <h3>Pizza</h3>
                    <p>Massa e ingredientes selecionados.</p>
                    <p class="preco">R$ 49,90</p>
                    <button class="btn">Pedir Agora</button>
                </div>
            </div>

            <div class="card">
                <div class="imagem-prato"></div>
                <div class="card-content">
                    <h3>Hambúrguer</h3>
                    <p>Carne e queijo.</p>
                    <p class="preco">R$ 34,90</p>
                    <button class="btn">Pedir Agora</button>
                </div>
            </div>

            <div class="card">
                <div class="imagem-prato"></div>
                <div class="card-content">
                    <h3>Macarrão</h3>
                    <p>Massa com molho.</p>
                    <p class="preco">R$ 39,90</p>
                    <button class="btn">Pedir Agora</button>
                </div>
            </div>

            <div class="card">
                <div class="imagem-prato"></div>
                <div class="card-content">
                    <h3>Sushi</h3>
                    <p>frutos do mar.</p>
                    <p class="preco">R$ 69,90</p>
                    <button class="btn">Pedir Agora</button>
                </div>
            </div>

        </div>
    </section>

    <section class="contato">
        <h2>Contato</h2>
        <p> Rua das Flores, 123</p>
        <p> (33) 99999-9999</p>
    </section>

    <footer>
    </footer>

</body>
</html>
